# NOTE: This filename is hardcoded in our trusted publishing setup on npmjs.com;
# do not change this filename without updating it there as well.
name: Publish to npm
on:
  pull_request:
    paths:
      - 'packaging/npm/**'
      - '.github/workflows/publish-npm.yaml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bash scripts/generate_packages.bash

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: packaging/npm/dist/

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: packaging/npm/dist/

      - run: bash scripts/smoke_test.bash

  publish:
    if: github.event_name == 'release'
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/

      - uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: 24

      # Platform packages are published first since @bufbuild/buf depends on
      # them as optionalDependencies.
      - run: |
          for package in dist/platforms/*.tgz dist/main/*.tgz; do
            npm publish --access public "${package}"
          done
